plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erafox.chessassist'
    compileSdk 34

    defaultConfig {
        applicationId 'com.erafox.chessassist'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/chess.jks')
            storePassword 'chess2026'
            keyAlias 'chess'
            keyPassword 'chess2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
